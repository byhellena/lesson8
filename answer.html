<title>정답 확인 앱</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout: one centered stage (title, two big letter tiles, check button, QR panel); a full-screen celebration overlay opens on the right answer. Single committed dark "game show" look. */
:root {
  --ink: #14123a;
  --panel: #221e66;
  --panel-edge: #4a43b5;
  --sun: #ffd23f;
  --coral: #ff5d73;
  --mint: #3ddc97;
  --paper: #fffdf5;
  --muted: #b9b4f0;
  --font-display: 'Jua', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
  --font-body: 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  background: var(--ink);
  color: var(--paper);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 28px 40px;
}
.stage { max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; gap: 28px; }
header { text-align: center; }
.eyebrow { font-size: .78rem; letter-spacing: .22em; text-transform: uppercase; color: var(--muted); margin: 0 0 6px; }
h1 { font-family: var(--font-display); font-weight: 400; font-size: clamp(2rem, 9vw, 2.8rem); line-height: 1.15; margin: 0; text-wrap: balance; color: var(--sun); }
.lede { margin: 8px 0 0; color: var(--muted); }

.game { display: flex; flex-direction: column; align-items: center; gap: 18px; }
.tiles { display: flex; align-items: center; justify-content: center; gap: 12px; }
.comma { font-family: var(--font-display); font-size: 2.6rem; color: var(--muted); line-height: 1; padding-top: 22px; }
.tile input {
  width: clamp(88px, 28vw, 124px);
  aspect-ratio: 1;
  border-radius: 20px;
  border: 3px solid var(--panel-edge);
  background: var(--panel);
  color: var(--sun);
  font-family: var(--font-display);
  font-size: clamp(3.2rem, 14vw, 4.6rem);
  text-align: center;
  text-transform: uppercase;
  caret-color: var(--coral);
  padding: 0;
  transition: border-color .15s, transform .15s, box-shadow .15s;
}
.tile input:focus { outline: none; border-color: var(--sun); box-shadow: 0 0 0 5px rgba(255,210,63,.25); transform: translateY(-3px); }
.tile input.filled { border-color: var(--muted); }
.tiles.shake { animation: shake .5s; }
.tiles.shake .tile input { border-color: var(--coral); }
@keyframes shake { 10%,90%{transform:translateX(-3px)} 20%,80%{transform:translateX(6px)} 30%,50%,70%{transform:translateX(-10px)} 40%,60%{transform:translateX(10px)} }

.msg { min-height: 1.6em; margin: 0; font-weight: 700; color: var(--coral); text-align: center; }
.msg.hint { color: var(--muted); font-weight: 400; }
.go {
  font-family: var(--font-display);
  font-size: 1.5rem;
  background: var(--sun);
  color: var(--ink);
  border: 0;
  border-radius: 16px;
  padding: 14px 44px;
  box-shadow: 0 6px 0 #c89a00;
  cursor: pointer;
  transition: transform .1s, box-shadow .1s, opacity .2s;
}
.go:hover:not(:disabled) { transform: translateY(-1px); }
.go:active:not(:disabled) { transform: translateY(5px); box-shadow: 0 1px 0 #c89a00; }
.go:disabled { opacity: .4; cursor: not-allowed; }
.go:focus-visible, .tile input:focus-visible { outline: 3px solid var(--paper); outline-offset: 3px; }


.chances { display: flex; align-items: center; gap: 12px; color: var(--muted); font-size: .95rem; }
.pips { display: flex; gap: 8px; }
.pip { width: 16px; height: 16px; border-radius: 50%; background: var(--sun); box-shadow: 0 0 0 3px rgba(255,210,63,.2); transition: background .3s, transform .3s; }
.pip.spent { background: transparent; border: 2px solid var(--panel-edge); box-shadow: none; transform: scale(.85); }

/* Treasure chest + padlock */
.game { width: 100%; }
.chest { position: relative; width: 100%; max-width: 520px; aspect-ratio: 400 / 340; container-type: inline-size; margin: 0 auto; }
.chest-svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; filter: drop-shadow(0 10px 18px rgba(0,0,0,.45)); }
.chest.buzz { animation: buzz 1s linear; }
@keyframes buzz{0%{transform:none} 4%{transform:translate(3px,-1.5px) rotate(0.9deg)} 8%{transform:translate(-3px,1.5px) rotate(-0.9deg)} 12%{transform:translate(3px,-1.5px) rotate(0.9deg)} 16%{transform:translate(-3px,1.5px) rotate(-0.9deg)} 20%{transform:translate(3px,-1.5px) rotate(0.9deg)} 24%{transform:translate(-3px,1.5px) rotate(-0.9deg)} 28%{transform:translate(3px,-1.5px) rotate(0.9deg)} 32%{transform:translate(-3px,1.5px) rotate(-0.9deg)} 36%{transform:translate(3px,-1.5px) rotate(0.9deg)} 40%{transform:translate(-3px,1.5px) rotate(-0.9deg)} 44%{transform:translate(3px,-1.5px) rotate(0.9deg)} 48%{transform:translate(-3px,1.5px) rotate(-0.9deg)} 52%{transform:translate(3px,-1.5px) rotate(0.9deg)} 56%{transform:translate(-3px,1.5px) rotate(-0.9deg)} 60%{transform:translate(3px,-1.5px) rotate(0.9deg)} 64%{transform:translate(-3px,1.5px) rotate(-0.9deg)} 68%{transform:translate(3px,-1.5px) rotate(0.9deg)} 72%{transform:translate(-3px,1.5px) rotate(-0.9deg)} 76%{transform:translate(3px,-1.5px) rotate(0.9deg)} 80%{transform:translate(-3px,1.5px) rotate(-0.9deg)} 84%{transform:translate(3px,-1.5px) rotate(0.9deg)} 88%{transform:translate(-3px,1.5px) rotate(-0.9deg)} 92%{transform:translate(3px,-1.5px) rotate(0.9deg)} 96%{transform:translate(-3px,1.5px) rotate(-0.9deg)} 100%{transform:none}}
.chest .tiles { position: absolute; left: 33.75%; top: 54.4%; width: 32.5%; gap: 4.6%; }
.chest .tile { flex: 1; display: block; min-width: 0; }
.chest .tile input { width: 100%; border-radius: 10px; border: 3px solid #7a5200; background: var(--ink); color: var(--sun); font-size: clamp(1.6rem, 9vw, 2.8rem); font-size: 10.5cqw; box-shadow: inset 0 3px 8px rgba(0,0,0,.6), 0 2px 0 rgba(255,255,255,.35); }
.chest .tile input.filled { border-color: #7a5200; }
.chest .tile input:focus { border-color: var(--sun); box-shadow: 0 0 0 4px rgba(255,255,255,.55), inset 0 3px 8px rgba(0,0,0,.6); transform: none; }
.sp { transform-box: fill-box; transform-origin: center; animation: twinkle 2.2s ease-in-out infinite; }
.sp.s2 { animation-delay: .5s; } .sp.s3 { animation-delay: 1s; } .sp.s4 { animation-delay: 1.5s; }
@keyframes twinkle { 0%,100% { opacity: .15; transform: scale(.6) } 50% { opacity: 1; transform: scale(1.15) } }
@media (prefers-reduced-motion: reduce) { .chest.buzz, .sp { animation: none; } }

/* Chest opening (about 3 seconds) */
.lid-in { transform-origin: 200px 142px; transform: scaleY(0); }
.lid-out { transform-origin: 200px 142px; }
.burst { opacity: 0; transform-origin: 200px 110px; }
.rays { transform-origin: 200px 110px; }
.treasure { opacity: 0; transform-origin: 200px 150px; transform: translateY(90px) scale(.7); }
.padlock { transform-origin: 200px 220px; }
.tsp { opacity: 0; transform-box: fill-box; transform-origin: center; }
.chest.opening .padlock { transform: translateY(260px) rotate(24deg); opacity: 0; animation: lockDrop .8s ease-in 0s both; }
.chest.opening .tiles { transform: translateY(60cqw) rotate(24deg); opacity: 0; pointer-events: none; animation: tilesDrop .8s ease-in 0s both; }
.chest.opening .lid-out { transform: scaleY(0); animation: lidOut .5s ease-in .7s both; }
.chest.opening .lid-in { transform: scaleY(1); animation: lidIn .75s ease-out 1.15s both; }
.chest.opening .burst { opacity: .95; animation: burstIn .9s ease-out 1.2s both; }
.chest.opening .rays { animation: spin 14s linear 1.2s infinite; }
.chest.opening .treasure { opacity: 1; transform: none; animation: treasureUp 1.3s cubic-bezier(.2,1.2,.4,1) 1.3s both; }
.chest.opening .tsp { animation: twinkle 1s ease-in-out infinite; }
.chest.opening .t1 { animation-delay: 2.0s; } .chest.opening .t2 { animation-delay: 2.2s; } .chest.opening .t3 { animation-delay: 2.4s; } .chest.opening .t4 { animation-delay: 2.1s; } .chest.opening .t5 { animation-delay: 2.5s; }
.chest .tile input:disabled { opacity: 1; -webkit-text-fill-color: var(--sun); }
@keyframes lockDrop { 0% { transform: none; opacity: 1 } 20% { transform: translateY(-12px) rotate(-6deg); opacity: 1 } 70% { opacity: 1 } }
@keyframes tilesDrop { 0% { transform: none; opacity: 1 } 20% { transform: translateY(-3cqw) rotate(-6deg); opacity: 1 } 70% { opacity: 1 } }
@keyframes lidOut { 0% { transform: scaleY(1) } }
@keyframes lidIn { 0% { transform: scaleY(0) } 70% { transform: scaleY(1.08) } }
@keyframes burstIn { 0% { opacity: 0; transform: scale(.2) } }
@keyframes treasureUp { 0% { opacity: 0; transform: translateY(90px) scale(.7) } 30% { opacity: 1 } 70% { transform: translateY(-14px) scale(1.04) } }
@media (prefers-reduced-motion: reduce) {
  .chest.opening .padlock, .chest.opening .tiles, .chest.opening .lid-out, .chest.opening .lid-in, .chest.opening .burst, .chest.opening .rays, .chest.opening .treasure, .chest.opening .tsp { animation: none; }
}

/* Out of chances */
#lose { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; background: radial-gradient(circle at 50% 40%, #3a1830 0%, #1a0f2a 55%, #0d0b1f 100%); padding: 24px max(16px, env(safe-area-inset-left, 0px)); }
#lose.open { animation: fadein .35s ease-out; }
.lose-body { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 18px; max-width: 520px; }
.lose-badge { font-family: var(--font-display); letter-spacing: .3em; font-size: .95rem; color: var(--ink); background: var(--coral); padding: 6px 16px 6px 20px; border-radius: 999px; }
.lose-big { font-family: var(--font-display); font-weight: 400; margin: 0; font-size: clamp(2.1rem, 10vw, 3.8rem); line-height: 1.2; color: var(--coral); text-wrap: balance; text-shadow: 0 4px 0 #7a1d2e; }
.lose-sub { margin: 0; color: var(--muted); }
.retry { background: var(--paper); color: var(--ink); box-shadow: 0 6px 0 #b9b4f0; }
@media (prefers-reduced-motion: reduce) { #lose.open { animation: none; } }

/* Celebration */
#win { position: fixed; inset: 0; z-index: 50; overflow: hidden; display: grid; place-items: center; background: radial-gradient(circle at 50% 45%, #6d32e8 0%, #3b1fa8 40%, #14123a 85%); padding: 24px max(16px, env(safe-area-inset-left, 0px)); }
#win.open { animation: fadein .35s ease-out; }
@keyframes fadein { from { opacity: 0 } to { opacity: 1 } }
.rays { position: absolute; inset: -60%; background: repeating-conic-gradient(from 0deg, rgba(255,210,63,.26) 0 7deg, transparent 7deg 18deg); -webkit-mask-image: radial-gradient(circle, #000 8%, transparent 62%); mask-image: radial-gradient(circle, #000 8%, transparent 62%); animation: spin 28s linear infinite; }
@keyframes spin { to { transform: rotate(360deg) } }
#fx { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.win-body { position: relative; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 18px; max-width: 100%; }
.badge { font-family: var(--font-display); letter-spacing: .3em; font-size: .95rem; color: var(--ink); background: var(--mint); padding: 6px 16px 6px 20px; border-radius: 999px; animation: drop .6s .1s both cubic-bezier(.2,1.4,.4,1); }
.big { font-family: var(--font-display); font-weight: 400; margin: 0; white-space: nowrap; font-size: clamp(2.6rem, 14vw, 6.2rem); line-height: 1.1; color: var(--sun); text-shadow: 0 5px 0 #d9402f, 0 12px 28px rgba(0,0,0,.45); }
.big span { display: inline-block; animation: pop .7s both cubic-bezier(.2,1.5,.4,1); }
.big span:nth-child(1){animation-delay:.15s} .big span:nth-child(2){animation-delay:.25s} .big span:nth-child(3){animation-delay:.35s}
.big span:nth-child(4){animation-delay:.45s} .big span:nth-child(5){animation-delay:.55s} .big span:nth-child(6){animation-delay:.65s}
@keyframes pop { 0% { transform: scale(0) rotate(-25deg); opacity: 0 } 70% { transform: scale(1.3) rotate(6deg); opacity: 1 } 100% { transform: scale(1) rotate(0); opacity: 1 } }
@keyframes drop { from { transform: translateY(-30px); opacity: 0 } to { transform: none; opacity: 1 } }
.big.wiggle span { animation: wig 1.6s ease-in-out infinite; }
.big.wiggle span:nth-child(odd) { animation-delay: .1s; }
@keyframes wig { 0%,100% { transform: translateY(0) rotate(0) } 50% { transform: translateY(-8px) rotate(-3deg) } }
.win-sub { font-size: 1.35rem; line-height: 1.5; margin: 0; color: var(--paper); animation: drop .6s .9s both; }
.win-sub b { font-family: var(--font-display); font-weight: 400; color: var(--sun); font-size: 1.6rem; letter-spacing: .08em; }
.win-sub2 { animation-delay: 1.1s; font-family: var(--font-display); font-size: 1.5rem; color: var(--mint); }
.dancers { display: flex; gap: 6px; justify-content: center; font-size: clamp(2.2rem, 11vw, 3.4rem); line-height: 1; animation: drop .6s 1.3s both; }
.dancers span { display: inline-block; animation: dance .9s ease-in-out infinite; transform-origin: 50% 100%; }
.dancers span:nth-child(2) { animation-delay: .15s; } .dancers span:nth-child(3) { animation-delay: .3s; } .dancers span:nth-child(4) { animation-delay: .45s; } .dancers span:nth-child(5) { animation-delay: .6s; }
@keyframes dance { 0%,100% { transform: translateY(0) rotate(-12deg) } 25% { transform: translateY(-14px) rotate(0) } 50% { transform: translateY(0) rotate(12deg) } 75% { transform: translateY(-14px) rotate(0) } }
.again { animation: drop .6s 1.5s both; background: var(--paper); color: var(--ink); box-shadow: 0 6px 0 #b9b4f0; }
@media (prefers-reduced-motion: reduce) {
  .rays { animation: none; }
  .big span, .badge, .win-sub, .again, .dancers, .dancers span { animation: none; }
  .big.wiggle span { animation: none; }
  #win.open { animation: none; }
  .tiles.shake { animation: none; }
}
</style>

    <h1>정답을 맞혀 보세요</h1>

  </header>

  <section class="game" aria-label="정답 입력">
    <div class="chest" id="chest">

        <!-- treasure (rises from behind the front wall) -->

            <rect x="306" y="0" width="32" height="150" fill="url(#gold)" stroke="#8a5a00" stroke-width="3"/>
          </g>

        <rect x="22" y="132" width="356" height="18" rx="5" fill="url(#gold)" stroke="#8a5a00" stroke-width="3"/>

        <!-- padlock -->
        <g class="padlock">
          <path d="M158 172V136a42 42 0 0 1 84 0V172" fill="none" stroke="#4a4f60" stroke-width="20" stroke-linecap="round"/>
          <path d="M158 172V136a42 42 0 0 1 84 0V172" fill="none" stroke="#d3d8e6" stroke-width="12" stroke-linecap="round"/>
          <rect x="125" y="165" width="150" height="112" rx="18" fill="url(#gold)" stroke="#8a5a00" stroke-width="4"/>
          <rect x="133" y="171" width="134" height="8" rx="4" fill="#fff" fill-opacity=".35"/>
          <circle cx="200" cy="262" r="5.5" fill="#5a3a00"/><rect x="198" y="262" width="4" height="9" rx="1.5" fill="#5a3a00"/>

        <!-- sparkles -->
        <g fill="#fffdf5" class="sparks">

          <path class="sp s3" d="M372 190l3 8 8 3-8 3-3 8-3-8-8-3 8-3z"/>
          <path class="sp s4" d="M18 210l3 7 7 3-7 3-3 7-3-7-7-3 7-3z"/>
        </g>
        <g fill="#fffdf5" class="tsparks">
          <path class="tsp t1" d="M96 60l4 10 10 4-10 4-4 10-4-10-10-4 10-4z"/>
          <path class="tsp t2" d="M300 52l4 10 10 4-10 4-4 10-4-10-10-4 10-4z"/>
          <path class="tsp t3" d="M200 20l3 8 8 3-8 3-3 8-3-8-8-3 8-3z"/>
          <path class="tsp t4" d="M330 110l3 8 8 3-8 3-3 8-3-8-8-3 8-3z"/>
          <path class="tsp t5" d="M62 104l3 8 8 3-8 3-3 8-3-8-8-3 8-3z"/>
        </g>
      </svg>
      <div class="tiles" id="tiles">
        <label class="tile"><span class="sr" style="position:absolute;left:-9999px">첫 번째 알파벳</span>
          <input id="l1" type="text" inputmode="text" lang="en" maxlength="1" autocomplete="off" autocapitalize="characters" autocorrect="off" spellcheck="false" enterkeyhint="next">
        </label>
        <label class="tile"><span class="sr" style="position:absolute;left:-9999px">두 번째 알파벳</span>
          <input id="l2" type="text" inputmode="text" lang="en" maxlength="1" autocomplete="off" autocapitalize="characters" autocorrect="off" spellcheck="false" enterkeyhint="done">
        </label>
      </div>
    </div>
    <div class="chances"><span>남은 기회</span><span class="pips" id="pips" aria-label="남은 기회 3번"><i class="pip"></i><i class="pip"></i><i class="pip"></i></span></div>
    <p class="msg hint" id="msg" role="status" aria-live="polite">영어(알파벳) 키보드로 입력해 주세요.</p>
    <button class="go" id="check" type="button" disabled>정답 확인</button>
  </section>

</main>

<div id="win" hidden role="dialog" aria-modal="true" aria-label="정답입니다">
  <div class="rays"></div>
  <canvas id="fx"></canvas>
  <div class="win-body">
    <div class="badge">CORRECT</div>
    <h2 class="big" id="big"><span>정</span><span>답</span><span>입</span><span>니</span><span>다</span><span>!</span></h2>
    <p class="win-sub">이 화면을 선생님께 보여드리고<br><b>스탬프</b>를 받아요.</p>
    <p class="win-sub win-sub2">카드도 선생님께 드려요 🎁</p>
    <div class="dancers" aria-hidden="true"><span>💃</span><span>🕺</span><span>👯</span><span>🕺</span><span>💃</span></div>
    <button class="go again" id="again" type="button">다시 하기</button>
  </div>
</div>

<div id="lose" hidden role="alertdialog" aria-modal="true" aria-label="모든 기회를 소진했습니다">
  <div class="lose-body">
    <div class="lose-badge">GAME OVER</div>
    <h2 class="lose-big">모든 기회를 소진했습니다</h2>
    <p class="lose-sub">3번의 기회를 모두 사용했어요.</p>
    <button class="go retry" id="retry" type="button">처음부터 다시</button>
  </div>
</div>

<script>
(function () {
  var ANSWER = ['H', 'J'];
  var l1 = document.getElementById('l1');
  var l2 = document.getElementById('l2');
  var inputs = [l1, l2];
  var tiles = document.getElementById('tiles');
  var msg = document.getElementById('msg');
  var checkBtn = document.getElementById('check');
  var win = document.getElementById('win');
  var big = document.getElementById('big');
  var againBtn = document.getElementById('again');
  var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

  var chest = document.getElementById('chest');
  function buzz() {
    if (!reduce) { chest.classList.remove('buzz'); void chest.offsetWidth; chest.classList.add('buzz'); }
    try { if (navigator.vibrate) navigator.vibrate(1000); } catch (err) {}
  }
  chest.addEventListener('animationend', function (e) { if (e.target === chest) chest.classList.remove('buzz'); });
  function clean(s) { return (s || '').replace(/[^a-zA-Z]/g, ''); }
  function setHint(text, isHint) { msg.textContent = text; msg.className = 'msg' + (isHint ? ' hint' : ''); }
  function update() {
    inputs.forEach(function (el) { el.classList.toggle('filled', !!el.value); });
    checkBtn.disabled = !(l1.value && l2.value);
  }

  inputs.forEach(function (el, i) {
    el.addEventListener('input', function () {
      var raw = el.value;
      var c = clean(raw);
      if (raw && !c) { setHint('알파벳만 입력할 수 있어요. 영어 키보드로 바꿔 주세요.', false); }
      else if (c) { setHint('영어(알파벳) 키보드로 입력해 주세요.', true); buzz(); }
      el.value = c.slice(-1).toUpperCase();
      if (el.value && i === 0) l2.focus();
      update();
    });
    el.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') { e.preventDefault(); check(); }
      else if (e.key === 'Backspace' && !el.value && i === 1) { e.preventDefault(); l1.value = ''; l1.focus(); update(); }
      else if (e.key === 'ArrowLeft' && i === 1) { l1.focus(); }
      else if (e.key === 'ArrowRight' && i === 0) { l2.focus(); }
    });
    el.addEventListener('focus', function () { try { el.select(); } catch (err) {} });
    el.addEventListener('paste', function (e) {
      var t = (e.clipboardData && e.clipboardData.getData('text')) || '';
      var c = clean(t).toUpperCase();
      if (!c) return;
      e.preventDefault();
      l1.value = c.charAt(0) || '';
      l2.value = c.charAt(1) || '';
      (l2.value ? l2 : l1).focus();
      update(); buzz();
    });
  });

  function isCorrect() {
    var a = l1.value.toUpperCase(), b = l2.value.toUpperCase();
    return (a === ANSWER[0] && b === ANSWER[1]) || (a === ANSWER[1] && b === ANSWER[0]);
  }

  var MAX_TRIES = 3, tries = 0;
  var pipsEl = document.getElementById('pips');
  var lose = document.getElementById('lose');
  var retryBtn = document.getElementById('retry');
  function renderPips() {
    var left = MAX_TRIES - tries;
    Array.prototype.forEach.call(pipsEl.children, function (p, i) { p.classList.toggle('spent', i >= left); });
    pipsEl.setAttribute('aria-label', '남은 기회 ' + left + '번');
  }
  function setLocked(on) { inputs.forEach(function (el) { el.disabled = on; }); if (on) checkBtn.disabled = true; else update(); }
  function resetGame() {
    opening = false; chest.classList.remove('opening', 'buzz');
    tries = 0; renderPips(); setLocked(false);
    l1.value = ''; l2.value = '';
    setHint('영어(알파벳) 키보드로 입력해 주세요.', true);
    update(); l1.focus();
  }
  function exhaust() {
    setLocked(true);
    lose.hidden = false;
    lose.classList.remove('open'); void lose.offsetWidth; lose.classList.add('open');
    retryBtn.focus();
  }
  retryBtn.addEventListener('click', function () { lose.hidden = true; lose.classList.remove('open'); resetGame(); });

  var opening = false;
  function openChest() {
    if (opening) return;
    opening = true;
    setLocked(true);
    try { if (navigator.vibrate) navigator.vibrate(0); } catch (err) {}
    setHint('자물쇠가 풀렸어요! 상자가 열려요...', true);
    chest.classList.remove('buzz');
    chest.classList.add('opening');
    setTimeout(function () { celebrate(); }, reduce ? 600 : 3200);
  }
  function check() {
    if (tries >= MAX_TRIES) return;
    if (!(l1.value && l2.value)) { setHint('알파벳 2개를 모두 입력해 주세요.', false); (l1.value ? l2 : l1).focus(); return; }
    if (isCorrect()) { openChest(); return; }
    tries++; renderPips();
    tiles.classList.remove('shake'); void tiles.offsetWidth; tiles.classList.add('shake');
    if (tries >= MAX_TRIES) {
      setHint('틀렸어요. 남은 기회가 없어요.', false);
      setLocked(true);
      setTimeout(exhaust, 900);
      return;
    }
    setHint('아쉬워요! 남은 기회는 ' + (MAX_TRIES - tries) + '번이에요.', false);
    setTimeout(function () { l1.value = ''; l2.value = ''; update(); l1.focus(); }, 650);
  }
  checkBtn.addEventListener('click', check);
  renderPips();

  /* ---------- Confetti & fireworks ---------- */
  var cv = document.getElementById('fx');
  var ctx = cv.getContext('2d');
  var W = 0, H = 0, parts = [], raf = 0, timers = [];
  var COLORS = ['#ffd23f', '#ff5d73', '#3ddc97', '#6ec1ff', '#ffffff', '#c28bff', '#ff9f43'];

  function resize() {
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = cv.clientWidth; H = cv.clientHeight;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  function burst(x, y, n, dir, spread, speed, grav) {
    for (var i = 0; i < n; i++) {
      var a = dir + (Math.random() - .5) * spread;
      var s = speed * (.45 + Math.random() * .75);
      parts.push({
        x: x, y: y, vx: Math.cos(a) * s, vy: Math.sin(a) * s,
        g: grav || (.2 + Math.random() * .1),
        w: 6 + Math.random() * 7, h: 9 + Math.random() * 9,
        r: Math.random() * 6.28, vr: (Math.random() - .5) * .4,
        c: COLORS[(Math.random() * COLORS.length) | 0],
        life: 0, max: 120 + Math.random() * 90,
        star: Math.random() < .22
      });
    }
  }
  function star(p) {
    var R = p.h * .7, r = R * .45;
    ctx.beginPath();
    for (var k = 0; k < 10; k++) {
      var rad = k % 2 ? r : R, ang = k * Math.PI / 5;
      ctx.lineTo(Math.cos(ang) * rad, Math.sin(ang) * rad);
    }
    ctx.closePath(); ctx.fill();
  }
  function frame() {
    ctx.clearRect(0, 0, W, H);
    parts = parts.filter(function (p) { return p.life < p.max && p.y < H + 60; });
    for (var i = 0; i < parts.length; i++) {
      var p = parts[i];
      p.vx *= .991; p.vy += p.g; p.x += p.vx; p.y += p.vy; p.r += p.vr; p.life++;
      var fade = 1 - Math.max(0, (p.life - p.max * .72) / (p.max * .28));
      ctx.save();
      ctx.globalAlpha = Math.max(0, fade);
      ctx.translate(p.x, p.y); ctx.rotate(p.r);
      ctx.fillStyle = p.c;
      if (p.star) star(p); else ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
      ctx.restore();
    }
    raf = requestAnimationFrame(frame);
  }
  function later(fn, ms) { timers.push(setTimeout(fn, ms)); }
  function show() {
    resize();
    var up = -Math.PI / 2;
    burst(W * .1, H, reduce ? 40 : 90, up + .45, 1.0, 17);
    burst(W * .9, H, reduce ? 40 : 90, up - .45, 1.0, 17);
    if (reduce) return;
    burst(W * .5, H * .95, 80, up, .8, 20);
    for (var k = 0; k < 7; k++) {
      (function (k) {
        later(function () {
          burst(W * (.15 + Math.random() * .7), H * (.12 + Math.random() * .38), 60, 0, 6.28, 7.5, .09);
        }, 500 + k * 650);
      })(k);
    }
    for (var j = 1; j <= 8; j++) {
      later(function () {
        burst(Math.random() * W, -10, 22, Math.PI / 2, .9, 3, .08);
        burst(W * .1, H, 30, up + .45, 1.0, 15);
        burst(W * .9, H, 30, up - .45, 1.0, 15);
      }, j * 800);
    }
  }
  function stopFx() {
    timers.forEach(clearTimeout); timers = [];
    cancelAnimationFrame(raf); raf = 0; parts = [];
    ctx.clearRect(0, 0, cv.width, cv.height);
  }

  function chime() {
    try {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      var ac = new AC();
      var notes = [523.25, 659.25, 783.99, 1046.5, 1318.5];
      notes.forEach(function (f, i) {
        var o = ac.createOscillator(), g = ac.createGain();
        o.type = 'triangle'; o.frequency.value = f;
        var t = ac.currentTime + i * 0.11;
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(0.22, t + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, t + 0.55);
        o.connect(g); g.connect(ac.destination);
        o.start(t); o.stop(t + 0.6);
      });
      setTimeout(function () { try { ac.close(); } catch (e) {} }, 1800);
    } catch (e) {}
  }

  function celebrate() {
    try { if (navigator.vibrate) navigator.vibrate(0); } catch (err) {}
    win.hidden = false;
    win.classList.remove('open'); void win.offsetWidth; win.classList.add('open');
    big.classList.remove('wiggle');
    var spans = big.querySelectorAll('span');
    spans.forEach(function (s) { s.style.animation = 'none'; void s.offsetWidth; s.style.animation = ''; });
    if (!reduce) setTimeout(function () { big.classList.add('wiggle'); }, 1500);
    show();
    if (!raf) raf = requestAnimationFrame(frame);
    chime();
    againBtn.focus();
  }
  function closeWin() {
    win.hidden = true; win.classList.remove('open');
    stopFx();
    resetGame();
  }
  againBtn.addEventListener('click', closeWin);
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !win.hidden) closeWin(); });
  window.addEventListener('resize', function () { if (!win.hidden) resize(); });

  update();
  l1.focus();
})();
</script>
